# Modest limits: a solo-maintained sample. Cooldown keeps a fresh release from landing on day one.
version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/workspace-contract"
      - "/workspace-domain"
      - "/workspace-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # The library under demonstration moves on its own, so each bump is visible.
      entity-metamodel:
        patterns:
          - "io.github.vadimbabich:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.openapitools:*"

  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/workspace-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
