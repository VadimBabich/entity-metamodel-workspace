name: Mutation testing

# Weekly, off the full hour, because GitHub delays scheduled runs at the start of every hour. The manual trigger
# stays because GitHub disables the schedule of a public repository after 60 days without activity.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mutation:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run the tests, then mutate and run them again
        run: ./mvnw -B -ntp -C -Ppit verify

      - name: Upload the mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: workspace-app/target/pit-reports/**
          retention-days: 14
          if-no-files-found: error
