name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A branch push and the pull request from the same branch share a group, so the superseded run is
# cancelled. Never on main: two merges close together must each leave a completed build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Unit tests, ArchUnit rules, and the integration tests against PostgreSQL in Testcontainers.
      # -C: an artifact whose checksum does not match fails the build instead of a warning.
      - name: Build and test
        run: ./mvnw -B -ntp -C verify

      # After a failed build too: the summary shows which phase failed.
      - name: Write the test summary
        if: always()
        run: .github/scripts/test-summary.sh >> "$GITHUB_STEP_SUMMARY"

      # On every run, not only on failure, so a passing run's numbers can be compared with the next.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            workspace-app/target/context-cache.txt
            workspace-app/target/site/jacoco-aggregate/**
            workspace-app/target/site/jacoco-merged/**
          retention-days: 7
          if-no-files-found: ignore

  compose-smoke:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package the application
        run: ./mvnw -B -ntp -C package -DskipTests

      - name: Start the stack and run the smoke test
        run: deploy/compose/smoke-test.sh

      - name: Run the k6 smoke
        run: deploy/compose/perf-smoke.sh

      - name: Show container logs
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml --profile app --profile observability logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --profile app --profile observability down -v

  dockerfile:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: workspace-app/Dockerfile
