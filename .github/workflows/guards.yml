name: Guards

# Separate from CI so a guard failure is unambiguous and these run once, not per job matrix.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: the history job checks only the commits its event adds, so a cancelled run
# would leave those commits checked by no completed run. Every job here takes seconds.

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans commit history, not just the worktree
          persist-credentials: false
      # Pinned by digest: a mutable tag could change what runs with the repository mounted.
      - name: Run gitleaks over full history
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

  policy:
    name: No private material, no unlisted addresses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail on tracked private paths
        run: .github/scripts/check-private-paths.sh

      - name: Fail on email addresses not in the allowlist
        run: .github/scripts/check-emails.sh tree

      # The secret scan reports none of the private keys a server-made Keycloak export carries.
      - name: Fail on a realm export with keys, a literal secret or no basic scope
        run: .github/scripts/check-realm-export.sh

  history:
    name: Linear history, no assistant attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # A pull request's default ref is a synthetic merge commit; check the branch as pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check the commits this event adds
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: .github/scripts/check-commit-messages.sh ci

  workflows:
    name: Workflow and script lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint also runs shellcheck over every run: block. Pinned by digest.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: shellcheck the repository's scripts
        run: |
          docker run --rm -v "$PWD:/mnt" --workdir /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -S style .github/scripts/*.sh .githooks/* .claude/hooks/*.sh deploy/compose/*.sh
