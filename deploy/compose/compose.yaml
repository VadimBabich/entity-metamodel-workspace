# Local stack for development and demonstration. Not a production deployment.
#
#   docker compose -f deploy/compose/compose.yaml up -d                        # infrastructure only
#   docker compose -f deploy/compose/compose.yaml --profile observability up -d
#   docker compose -f deploy/compose/compose.yaml --profile app up -d --build  # after ./mvnw package
#
# Every credential below is a development default for a disposable local stack.

name: workspace

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
    ports:
      - "127.0.0.1:${WORKSPACE_DB_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under a versioned directory; mount the parent.
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the image's initialisation server listens on the socket only, so this passes only
      # once the final server is up.
      test: ["CMD-SHELL", "pg_isready -h localhost -U workspace -d workspace"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      # Host and database rather than KC_DB_URL: a JDBC URL here is reported by the secret scan.
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Resolves the realm file's ${KEYCLOAK_SYNC_SECRET}; left unset, Keycloak would take that text as the secret.
      KEYCLOAK_SYNC_SECRET: ${KEYCLOAK_SYNC_SECRET:-workspace-sync-local-dev-secret}
      # One issuer for browsers and for the application container alike.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl; the management port answers health on 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  s3:
    image: versity/versitygw:v1.11.0
    entrypoint: ["sh", "-c", "mkdir -p /data && exec versitygw posix /data"]
    environment:
      ROOT_ACCESS_KEY: workspace
      ROOT_SECRET_KEY: workspace-secret-key
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - s3-data:/data

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  app:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: workspace-app/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      OIDC_ISSUER_URI: http://localhost:8180/realms/workspace
      # Keys are fetched over the compose network; the issuer is still checked against the claim.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workspace/protocol/openid-connect/certs
      LOG_FORMAT: ecs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-db-data:
  s3-data:
