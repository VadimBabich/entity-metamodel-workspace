openapi: 3.1.0
info:
  title: Document workspace
  version: 0.4.0
  x-api-id: 55c74d5c-1319-4efe-91fa-ecdd7d7159ba
  description: >
    The contract of the reference application. Server interfaces are generated from this document;
    the document, not the code, is the source of the API.
  contact:
    name: entity-metamodel-workspace
    url: https://github.com/VadimBabich/entity-metamodel-workspace
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: folders
    description: Folders and their contents.

paths:
  /api/v1/top-level-folders:
    get:
      tags: [folders]
      operationId: listTopLevelFolders
      summary: List the top-level folders the caller may see, by name.
      description: >
        Returns the first page of the caller's company's live top-level folders on which the caller holds
        a grant, ordered by name. Each item names what the caller may do with it.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The first page of top-level folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/folders/{folderId}/children:
    get:
      tags: [folders]
      operationId: listFolderChildren
      summary: List a folder's children, folders first, then by name.
      description: >
        Returns the first page of a folder's live children: folders before files, each group ordered
        by name. Trashed items are not listed. The folder must be one the caller may list; each item names
        what the caller may do with it.
      parameters:
        - name: folderId
          in: path
          required: true
          description: The folder whose children are listed.
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The first page of children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ItemNotFound'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: The largest number of items the page holds.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50

  responses:
    InvalidRequest:
      description: >
        invalid-request: a parameter is missing, of the wrong type, or outside its documented range.
    Unauthenticated:
      description: >
        unauthenticated: the request carries no bearer token, or one that is expired, not signed by
        the identity provider, or issued for another audience. The response carries a
        WWW-Authenticate header.
    ItemNotFound:
      description: >
        item-not-found: no item with this id exists in the caller's company, it is trashed, it is not a
        folder, or the caller may not list it. The four cases answer alike.
    IdentityProviderUnavailable:
      description: >
        identity-provider-unavailable: the keys that verify the bearer token cannot be obtained from
        the identity provider now. The response carries a Retry-After header; the same request may
        succeed after it.
    UnexpectedError:
      description: >
        An error the request did not cause. The response names no detail of it; retrying later may
        succeed.

  schemas:
    Identifier:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991

    NodeKind:
      type: string
      enum: [FOLDER, FILE]

    Capabilities:
      type: object
      required: [list, read]
      properties:
        list:
          type: boolean
          description: The caller may list this folder's children. Always false for a file.
        read:
          type: boolean
          description: The caller may read this item.

    Node:
      type: object
      required: [id, kind, name, createdAt, capabilities]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          $ref: '#/components/schemas/NodeKind'
        name:
          type: string
        parentId:
          $ref: '#/components/schemas/Identifier'
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    NodePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
