# Bounds test and lifecycle methods only. A Spring context and its containers start outside them, so a slow start is
# bounded by the container's startup timeout and Failsafe's forkedProcessTimeoutInSeconds instead.
junit.jupiter.execution.timeout.default=15 s

# ContextBudgetIT is ordered last, so it counts the contexts of every other test class in its JVM.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
