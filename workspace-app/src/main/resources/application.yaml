spring:
  application:
    name: workspace
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:workspace}
    username: ${DB_USER:workspace}
    password: ${DB_PASSWORD:workspace}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:workspace}
    user: ${DB_USER:workspace}
    password: ${DB_PASSWORD:workspace}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/workspace}
          audiences: workspace-api

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
