spring:
  application:
    name: workspace
  messages:
    fallback-to-system-locale: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:workspace}
    username: ${DB_APP_USER:workspace_app}
    password: ${DB_APP_PASSWORD:workspace-app-local-development-password}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:workspace}
    user: ${DB_MIGRATION_USER:workspace_migrator}
    password: ${DB_MIGRATION_PASSWORD:workspace-migrator-local-development-password}
    validate-migration-naming: true
    placeholders:
      appRole: ${spring.r2dbc.username}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/workspace}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
          audiences: workspace-api
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: workspace-sync
            client-secret: ${KEYCLOAK_SYNC_SECRET:workspace-sync-local-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}

workspace:
  mirror:
    admin-uri: ${KEYCLOAK_ADMIN_URI:http://localhost:8180/admin/realms/workspace}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
